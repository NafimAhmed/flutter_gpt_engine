name: flutter_gpt_engine
description: Flutter_GPT_Engine - headless/offline GGUF chat engine for Flutter. UI is fully controlled by the host app.
version: 0.0.7
homepage: https://github.com/NafimAhmed/flutter_gpt_engine

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  file_picker: ^10.3.10
  llama_flutter_android: ^0.2.6
  path_provider: ^2.1.4
  html: ^0.15.7
  flutter:
    sdk: flutter
  battery_plus: ^6.2.3
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  geocoding: ^5.0.0
  geolocator: 14.0.2
  package_info_plus: ^8.3.1
  sensors_plus: ^6.1.2
  system_info2: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

